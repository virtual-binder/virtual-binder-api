name: Publish API

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-image-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_API_ROLE_ARN: ${{ vars.AWS_API_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate CI configuration
        run: |
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_API_ROLE_ARN"
          echo "IMAGE_REPOSITORY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/virtual-binder" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build --tag "$IMAGE_REPOSITORY:$GITHUB_SHA" ./backend

      - name: Smoke test image
        run: |
          docker run --detach --name api-smoke --publish 8000:8000 "$IMAGE_REPOSITORY:$GITHUB_SHA"
          trap 'docker logs api-smoke; docker rm --force api-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error \
            --request POST \
            --form "archivo=@assets/samples/IMG_20261112_220900586.jpg;type=image/jpeg" \
            "http://localhost:8000/identificar?incluir_recortes=false" \
            --output smoke.json
          python3 -c 'import json; data = json.load(open("smoke.json")); assert data["total"] == 9, data["total"]'

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_API_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Publish image
        id: publish
        run: |
          docker push "$IMAGE_REPOSITORY:$GITHUB_SHA"
          image=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REPOSITORY:$GITHUB_SHA")
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Create infrastructure dispatch token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.INFRA_DISPATCH_APP_ID }}
          private-key: ${{ secrets.INFRA_DISPATCH_PRIVATE_KEY }}
          owner: virtual-binder
          repositories: virtual-binder-infra

      - name: Request protected deployment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          API_IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          gh api --method POST repos/virtual-binder/virtual-binder-infra/dispatches \
            --field event_type=api-image-built \
            --field "client_payload[image]=${API_IMAGE}"
